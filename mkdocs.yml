site_name: Documentación G5-Service
site_description: Documentación del sistema de gestión comercial G5-Service
site_url: https://softwareinfra.github.io/gestion-comercial-documentation/
repo_url: https://github.com/softwareinfra/gestion-comercial-documentation
repo_name: gestion-comercial-documentation
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Negocio:
      - Propuesta de proyecto: negocio/propuesta-de-proyecto.md
  - Técnico:
      - Conclusiones tecnológicas: tecnico/conclusiones-tecnologicas.md
  - Desarrollo:
      - Contexto del proyecto: desarrollo/contexto-del-proyecto.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

validation:
  links:
    not_found: info
    unrecognized_links: info
